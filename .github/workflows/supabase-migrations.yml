name: Migrações do Supabase

# Aplica supabase/migrations no projeto de produção quando chegam na main e
# publica as Edge Functions (supabase/functions).
# Só roda depois que os testes de RLS passam.
#
# Configure no GitHub (Settings > Secrets and variables > Actions):
#   variável  SUPABASE_PROJECT_ID    (ex.: abcdefghijklmnop)
#   segredo   SUPABASE_ACCESS_TOKEN  (supabase.com > Account > Access Tokens)
#   segredo   SUPABASE_DB_PASSWORD   (a senha do banco definida ao criar o projeto)
# Enquanto a variável não existir, o workflow é pulado.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  test:
    if: ${{ vars.SUPABASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w @alinhavo/supabase

  push:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
      # O CLI 3.x mira o banco local por padrão; --remote usa o projeto ligado acima.
      # --yes: no CI não há terminal para confirmar. A confirmação aqui é o teste
      # de RLS acima e o ambiente production. Localmente, db:push segue perguntando.
      - run: supabase db push --remote --yes
      # Edge Functions depois do banco (a função usa approval_video_path, criada numa migração).
      # --use-api: o Supabase empacota no servidor (sem Docker no runner).
      # --yes: como no db push, o CLI 3 pede confirmação e no CI não há terminal.
      # --no-verify-jwt: a função é pública (quem garante é o token da aprovação) e a chave
      # publicável (sb_publishable_) não é JWT. Igual a [functions.aprovacao-video] no config.toml.
      # SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY o Supabase põe no ambiente da função: nada a configurar.
      - run: supabase functions deploy aprovacao-video --project-ref "${{ vars.SUPABASE_PROJECT_ID }}" --use-api --no-verify-jwt --yes
      # Envio dos webhooks: quem chama é o Supabase Cron, com WEBHOOK_DISPATCH_SECRET (a
      # função recusa sem ele); por isso também sem verificação de JWT. O segredo é
      # configurado à mão (docs/07-deploy.md), não pelo CI.
      - run: supabase functions deploy webhooks-dispatch --project-ref "${{ vars.SUPABASE_PROJECT_ID }}" --use-api --no-verify-jwt --yes
